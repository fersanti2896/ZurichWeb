<shared-loading-page *ngIf="isLoading"></shared-loading-page>

<div class="relative flex items-center mb-4 mt-10">
    <h2 class="absolute left-1/2 -translate-x-1/2 text-xl font-semibold text-gray-800 dark:text-gray-800">
        Clientes
    </h2>

    <div class="ml-auto">
        <button mat-raised-button class="btn-success h-10 px-4 text-sm" (click)="goNew()">
            Alta Cliente
        </button>
    </div>
</div>

<!-- Filtros (server-side) -->
<form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="mb-4">
    <div class="flex flex-col md:flex-row gap-4 w-full">

        <mat-form-field appearance="fill" class="w-full md:w-60">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" placeholder="Ej. Marisol" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full md:w-60">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" placeholder="Ej. marisol@gmail.com" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full md:w-60">
            <mat-label>Identificación</mat-label>
            <input matInput formControlName="identificationNumber" placeholder="Ej. 7824692019" />
        </mat-form-field>

        <div class="w-full md:w-auto flex items-end gap-2 pb-5">
            <button mat-raised-button class="btn-success h-10" type="submit">
                Filtrar
            </button>

            <button mat-raised-button class="btn-cancel h-10" type="button" (click)="clearFilters()">
                Limpiar
            </button>
        </div>

    </div>
</form>

<!-- Tabla -->
<div class="mat-elevation-z8 overflow-x-auto">
    <div class="min-w-[900px]">
        <table mat-table [dataSource]="dataSource" matSort>

            <ng-container matColumnDef="clientId">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                <td mat-cell *matCellDef="let c">{{ c.clientId }}</td>
            </ng-container>

            <ng-container matColumnDef="fullName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Cliente</th>
                <td mat-cell *matCellDef="let c">{{ c.fullName | titlecase }}</td>
            </ng-container>

            <ng-container matColumnDef="identificationNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Identificación</th>
                <td mat-cell *matCellDef="let c">{{ c.identificationNumber }}</td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                <td mat-cell *matCellDef="let c">{{ c.email }}</td>
            </ng-container>

            <ng-container matColumnDef="phoneNumber">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Teléfono</th>
                <td mat-cell *matCellDef="let c">{{ c.phoneNumber }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Estatus</th>
                <td mat-cell *matCellDef="let c">
                    {{ c.status === 1 ? 'Activo' : 'Inactivo' }}
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Acciones</th>
                <td mat-cell *matCellDef="let c">
                    <button mat-icon-button matTooltip="Editar" (click)="editClient(c)">
                        <mat-icon>edit_square</mat-icon>
                    </button>

                    <button mat-icon-button matTooltip="Eliminar" (click)="openDeleteDialog(c)">
                        <mat-icon color="warn">delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSizeOptions]="[25, 50, 100]" aria-label="Selector de página"></mat-paginator>
    </div>
</div>
