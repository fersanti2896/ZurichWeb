<shared-loading-page *ngIf="isLoading"></shared-loading-page>

<div class="relative flex items-center mb-4 mt-10">
    <h2 class="absolute left-1/2 -translate-x-1/2 text-xl font-semibold text-gray-800 dark:text-gray-800">
        Mis Pólizas
    </h2>
</div>

<div class="mat-elevation-z8 overflow-x-auto mt-10">
    <div class="min-w-[1100px]">
        <table mat-table [dataSource]="dataSource" matSort>

            <ng-container matColumnDef="policyId">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Num Póliza</th>
                <td mat-cell *matCellDef="let p">{{ p.policyId }}</td>
            </ng-container>

            <ng-container matColumnDef="policyName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Póliza</th>
                <td mat-cell *matCellDef="let p">{{ p.policyName }}</td>
            </ng-container>

            <ng-container matColumnDef="statusName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Estatus</th>
                <td mat-cell *matCellDef="let p">
                    <span class="px-3 py-1 rounded-full text-xs font-medium" [ngClass]="{
              'bg-green-100 text-green-700': p.policyStatusId === 1,
              'bg-yellow-100 text-yellow-700': p.policyStatusId === 2,
              'bg-red-100 text-red-700': p.policyStatusId === 3
            }">
                        {{ p.statusName }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="startDate">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Inicio</th>
                <td mat-cell *matCellDef="let p">{{ p.startDate | date:'dd/MM/yyyy' }}</td>
            </ng-container>

            <ng-container matColumnDef="endDate">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Fin</th>
                <td mat-cell *matCellDef="let p">{{ p.endDate | date:'dd/MM/yyyy' }}</td>
            </ng-container>

            <ng-container matColumnDef="insuredAmount">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Monto Asegurado</th>
                <td mat-cell *matCellDef="let p">{{ p.insuredAmount | currency:'MXN':'symbol':'1.2-2' }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Acciones</th>
                <td mat-cell *matCellDef="let p">
                    <button *ngIf="p.policyStatusId != 2" mat-icon-button matTooltip="Solicitar cancelación"
                        (click)="openCancelRequestDialog(p)">
                        <mat-icon color="warn">cancel</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSizeOptions]="[25, 50, 100]" aria-label="Selector de página"></mat-paginator>
    </div>
</div>
